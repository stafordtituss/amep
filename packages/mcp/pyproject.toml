[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amep-mcp"
version = "0.1.0a4"
description = "MCP server that verifies AMEP evidence: whether AI agent actions stayed within delegated authority."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Staford Titus Selvaraj" }]
keywords = ["mcp", "model context protocol", "ai agents", "delegation", "authorization", "audit", "amep"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = ["amep-protocol>=0.3.0a3", "mcp>=2.3"]

[project.urls]
Homepage = "https://github.com/stafordtituss/amep/tree/main/packages/mcp"
Specification = "https://github.com/stafordtituss/amep/blob/main/spec/amep-v0.2.md"

[project.scripts]
amep-mcp = "amep_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
amep_mcp = ["data/suite.json"]
