[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amep-agents"
version = "0.1.0a1"
description = "AMEP evidence for agent frameworks: signed records that tool calls stayed within delegated authority (OpenAI Agents SDK, LangGraph, LangChain)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Staford Titus Selvaraj" }]
keywords = ["ai agents", "openai agents sdk", "langgraph", "langchain", "authorization", "audit", "amep"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = ["amep-protocol>=0.2.0a5"]

[project.optional-dependencies]
openai-agents = ["openai-agents>=0.25"]
langgraph = ["langchain-core>=1.0", "langgraph>=1.0"]

[project.urls]
Homepage = "https://github.com/stafordtituss/amep/tree/main/packages/agents"
Specification = "https://github.com/stafordtituss/amep/blob/main/spec/amep-v0.2.md"

[tool.setuptools.packages.find]
where = ["src"]
