[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amep-protocol"
version = "0.3.0a1"
description = "Verify and produce AMEP (Agentic Mandate Evidence Protocol) evidence: proof that AI agent actions stayed within delegated authority."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Staford Titus Selvaraj" }]
keywords = ["ai agents", "delegation", "authorization", "audit", "evidence", "amep"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = ["cryptography>=41"]

[project.urls]
Homepage = "https://github.com/stafordtituss/amep"
Specification = "https://github.com/stafordtituss/amep/blob/main/spec/amep-v0.2.md"

[project.scripts]
amep-protocol = "amep_protocol.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
