<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 240" width="1280" height="240" role="img" aria-label="The chain: mandate, delegation, invocation, effect, each signed, then a verdict"><rect width="1280" height="240" rx="10" fill="#0a0e13"/><rect x="40" y="60" width="212" height="150" rx="8" fill="#111821" stroke="#243140" stroke-width="2"/><text x="58" y="90" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="2" fill="#8c99a8">01 · SIGNED BY</text><text x="56" y="136" font-family="'Big Shoulders Display','Arial Narrow','Helvetica Neue Condensed','Roboto Condensed',Impact,sans-serif" font-weight="900" font-size="30" fill="#ece8df">MANDATE</text><text x="58" y="168" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#8c99a8">the person</text><text x="58" y="188" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#8c99a8">or organization</text><path d="M258 135 h26" stroke="#e08a3c" stroke-width="2.5"/><path d="M278 129 l8 6 l-8 6" fill="none" stroke="#e08a3c" stroke-width="2.5"/><rect x="292" y="60" width="212" height="150" rx="8" fill="#111821" stroke="#243140" stroke-width="2"/><text x="310" y="90" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="2" fill="#8c99a8">02 · SIGNED BY</text><text x="308" y="136" font-family="'Big Shoulders Display','Arial Narrow','Helvetica Neue Condensed','Roboto Condensed',Impact,sans-serif" font-weight="900" font-size="30" fill="#ece8df" textLength="180" lengthAdjust="spacingAndGlyphs">DELEGATION</text><text x="310" y="168" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#8c99a8">the delegator,</text><text x="310" y="188" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#8c99a8">only ever narrower</text><path d="M510 135 h26" stroke="#e08a3c" stroke-width="2.5"/><path d="M530 129 l8 6 l-8 6" fill="none" stroke="#e08a3c" stroke-width="2.5"/><rect x="544" y="60" width="212" height="150" rx="8" fill="#111821" stroke="#243140" stroke-width="2"/><text x="562" y="90" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="2" fill="#8c99a8">03 · SIGNED BY</text><text x="560" y="136" font-family="'Big Shoulders Display','Arial Narrow','Helvetica Neue Condensed','Roboto Condensed',Impact,sans-serif" font-weight="900" font-size="30" fill="#ece8df" textLength="180" lengthAdjust="spacingAndGlyphs">INVOCATION</text><text x="562" y="168" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#8c99a8">the agent's</text><text x="562" y="188" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#8c99a8">host</text><path d="M762 135 h26" stroke="#e08a3c" stroke-width="2.5"/><path d="M782 129 l8 6 l-8 6" fill="none" stroke="#e08a3c" stroke-width="2.5"/><rect x="796" y="60" width="212" height="150" rx="8" fill="#111821" stroke="#e08a3c" stroke-width="2"/><text x="814" y="90" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="2" fill="#8c99a8">04 · SIGNED BY</text><text x="812" y="136" font-family="'Big Shoulders Display','Arial Narrow','Helvetica Neue Condensed','Roboto Condensed',Impact,sans-serif" font-weight="900" font-size="30" fill="#ece8df">EFFECT</text><text x="814" y="168" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#8c99a8">whoever executed it,</text><text x="814" y="188" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#8c99a8">not the agent (I10)</text><path d="M1014 135 h26" stroke="#e08a3c" stroke-width="2.5"/><path d="M1034 129 l8 6 l-8 6" fill="none" stroke="#e08a3c" stroke-width="2.5"/><rect x="1048" y="60" width="212" height="150" rx="8" fill="#111821" stroke="#8fc3ff" stroke-width="2"/><text x="1066" y="90" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="2" fill="#8c99a8">05 · CHECKED BY</text><text x="1064" y="136" font-family="'Big Shoulders Display','Arial Narrow','Helvetica Neue Condensed','Roboto Condensed',Impact,sans-serif" font-weight="900" font-size="30" fill="#ece8df">VERDICT</text><text x="1066" y="168" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#8c99a8">any verifier,</text><text x="1066" y="188" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#8c99a8">offline</text><text x="40" y="34" font-family="Newsreader,Georgia,'Times New Roman',serif" font-style="italic" font-size="22" fill="#8fc3ff">Each link is signed by the party that made it. Anyone holding them reaches the same verdict.</text></svg>
