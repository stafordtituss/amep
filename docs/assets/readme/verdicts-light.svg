<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="Three verdicts: preserved, violated, unresolved"><rect width="1280" height="340" rx="10" fill="#f4f1ea"/><rect x="40" y="24" width="385" height="292" rx="8" fill="#fbfaf6" stroke="#d6d0c2" stroke-width="1.5"/><rect x="60" y="44" width="345" height="120" rx="6" fill="none" stroke="#586474" stroke-width="2"/><rect x="149.7" y="75.2" width="165.6" height="57.599999999999994" rx="5" fill="#1f5fa6" fill-opacity="0.08" stroke="#1f5fa6" stroke-width="2" stroke-dasharray="7 5"/><circle cx="78" cy="148" r="5" fill="#b65f14"/><path d="M78 148 C 138 148, 202.5 134.0, 232.5 104.0" fill="none" stroke="#b65f14" stroke-width="2.5"/><circle cx="232.5" cy="104.0" r="9" fill="#1d8350"/><text x="62" y="216" font-family="'Big Shoulders Display','Arial Narrow','Helvetica Neue Condensed','Roboto Condensed',Impact,sans-serif" font-weight="900" font-size="40" fill="#1d8350">PRESERVED</text><text x="62" y="250" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#586474">Everything that happened stayed</text><text x="62" y="272" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#586474">inside what was allowed, at every</text><text x="62" y="294" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#586474">step of the chain.</text><rect x="445" y="24" width="385" height="292" rx="8" fill="#fbfaf6" stroke="#d6d0c2" stroke-width="1.5"/><rect x="465" y="44" width="345" height="120" rx="6" fill="none" stroke="#586474" stroke-width="2"/><rect x="554.7" y="75.2" width="165.6" height="57.599999999999994" rx="5" fill="#1f5fa6" fill-opacity="0.08" stroke="#1f5fa6" stroke-width="2" stroke-dasharray="7 5"/><circle cx="483" cy="148" r="5" fill="#b65f14"/><path d="M483 148 C 623 148, 764 140, 784 70" fill="none" stroke="#b65f14" stroke-width="2.5"/><circle cx="784" cy="70" r="9" fill="#c4321e"/><path d="M779 65 l10 10 M789 65 l-10 10" stroke="#fbfaf6" stroke-width="2.2"/><text x="467" y="216" font-family="'Big Shoulders Display','Arial Narrow','Helvetica Neue Condensed','Roboto Condensed',Impact,sans-serif" font-weight="900" font-size="40" fill="#c4321e">VIOLATED</text><text x="467" y="250" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#586474">It crossed a boundary. The result</text><text x="467" y="272" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#586474">names the rule broken and the</text><text x="467" y="294" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#586474">party that departed first.</text><rect x="850" y="24" width="385" height="292" rx="8" fill="#fbfaf6" stroke="#d6d0c2" stroke-width="1.5"/><rect x="870" y="44" width="345" height="120" rx="6" fill="none" stroke="#586474" stroke-width="2"/><rect x="959.7" y="75.2" width="165.6" height="57.599999999999994" rx="5" fill="#1f5fa6" fill-opacity="0.08" stroke="#1f5fa6" stroke-width="2" stroke-dasharray="7 5"/><circle cx="888" cy="148" r="5" fill="#b65f14"/><path d="M888 148 C 938 148, 990.78 144.0, 1016.78 118.0" fill="none" stroke="#b65f14" stroke-width="2.5" stroke-dasharray="2 6"/><circle cx="1050.78" cy="104.0" r="13" fill="none" stroke="#9a6a00" stroke-width="2" stroke-dasharray="3 3"/><text x="1050.78" y="110.0" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#9a6a00">?</text><text x="872" y="216" font-family="'Big Shoulders Display','Arial Narrow','Helvetica Neue Condensed','Roboto Condensed',Impact,sans-serif" font-weight="900" font-size="40" fill="#9a6a00">UNRESOLVED</text><text x="872" y="250" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#586474">A record is missing. The result</text><text x="872" y="272" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#586474">names it. A gap is never read</text><text x="872" y="294" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#586474">as permission.</text></svg>
