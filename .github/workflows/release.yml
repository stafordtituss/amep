name: release

# Publishes both packages when a version tag is pushed, for example: git tag v0.2.0a4 && git push --tags
# One-time setup (see PUBLISHING.md):
#   PyPI: add a "trusted publisher" for project amep-protocol -> this repository, workflow release.yml,
#         environment pypi. No token needed.
#   npm:  create an automation token and store it as the repository secret NPM_TOKEN.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # trusted publishing to PyPI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --quiet build
          python -m build packages/python --outdir dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write          # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: node --test packages/js/test/*.test.mjs
      - run: npm publish --provenance --access public
        working-directory: packages/js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
