name: packages

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: License files in the package match the repository
        run: cmp LICENSE-CODE packages/python/LICENSE && cmp NOTICE packages/python/NOTICE
      - name: Build the wheel and install it into a clean environment
        run: |
          python -m pip install --quiet build
          python -m build packages/python --outdir dist
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet dist/*.whl
      - name: Installed CLI passes the conformance suite
        run: |
          /tmp/venv/bin/amep-protocol version
          /tmp/venv/bin/amep-protocol check-suite vectors
      - name: Unit tests
        run: |
          python -m pip install --quiet cryptography
          python -m unittest discover -s packages/python/tests

  javascript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: License files in the package match the repository
        run: cmp LICENSE-CODE packages/js/LICENSE && cmp NOTICE packages/js/NOTICE
      - name: Unit tests
        run: node --test packages/js/test/*.test.mjs
      - name: Pack, install into a clean project, and run the installed CLI
        run: |
          (cd packages/js && npm pack --pack-destination /tmp)
          mkdir /tmp/app && cd /tmp/app && npm init -y > /dev/null
          npm install --no-audit --no-fund /tmp/*amep-*.tgz
          npx amep-protocol version
          npx amep-protocol check-suite "$GITHUB_WORKSPACE/vectors"

  integrations:
    # amep-mcp and amep-agents against the core package in this checkout, with their frameworks installed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the core package, the MCP SDK and both agent frameworks
        run: python -m pip install --quiet ./packages/python "mcp>=2.3" "./packages/agents[openai-agents,langgraph]"
      - name: amep-mcp bundles the current conformance suites
        run: python -I packages/mcp/build_suite.py --check
      - name: amep-mcp tests (in process and over stdio)
        run: PYTHONPATH=packages/mcp/src python -m unittest discover -s packages/mcp/tests
      - name: amep-agents tests (OpenAI Agents SDK and LangGraph)
        run: PYTHONPATH=packages/agents/tests python -m unittest discover -s packages/agents/tests
