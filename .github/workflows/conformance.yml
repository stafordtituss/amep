name: conformance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet cryptography jsonschema

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: gem install --no-document cddl

      - name: Vectors match the generator
        run: |
          python -I verifier/python/amep_verifier.py
          git diff --exit-code -- vectors

      - name: Python verifier (from disk)
        run: python -I verifier/python/amep_verifier.py --check vectors

      - name: JavaScript verifier (Node.js)
        run: node verifier/typescript/amep_verifier.mjs vectors

      - name: Browser verifier is up to date and passes
        run: |
          node verifier/browser/build.mjs
          git diff --exit-code -- verifier/browser/amep-verify.html
          node verifier/browser/test_page.mjs

      - name: Schemas are up to date; both JSON Schema validators agree
        run: |
          python -I tools/build_schemas.py schemas/v0.2
          git diff --exit-code -- schemas/v0.2
          python tools/validate_schemas.py

      - name: CDDL
        run: python -I tools/validate_cddl.py cddl

      - name: Spec Appendix B matches the suite
        run: python -I tools/vector_index.py --check

      - name: No AI or tool attribution
        run: python -I tools/attribution_check.py
